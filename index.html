<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CookFam" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>Cooking With Fam</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1a1a1a; height: 100%; overflow: hidden; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
      /* Hidden camera input, triggered from Phaser. */
      #camera-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <input id="camera-input" type="file" accept="image/*" capture="environment" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
